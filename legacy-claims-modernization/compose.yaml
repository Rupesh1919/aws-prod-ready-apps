# Docker Compose for local development
version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: claims-db
    environment:
      POSTGRES_DB: claims_db
      POSTGRES_USER: claims_user
      POSTGRES_PASSWORD: claims_dev_password_CHANGE_IN_PRODUCTION
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claims_user -d claims_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - claims-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: claims-api
    environment:
      # Database
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: claims_db
      DATABASE_USER: claims_user
      DATABASE_PASSWORD: claims_dev_password_CHANGE_IN_PRODUCTION
      DATABASE_SSL_MODE: disable
      
      # Application
      ENVIRONMENT: local
      LOG_LEVEL: INFO
      
      # Server
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8000
      
      # Authentication - DISABLED for local testing
      # NEVER disable in production
      AUTH_ENABLED: "false"
      
      # OpenAPI docs - enabled locally
      OPENAPI_ENABLED: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - claims-network
    # For development, you can mount the code
    # volumes:
    #   - ./claims_api:/app/claims_api

volumes:
  postgres_data:

networks:
  claims-network:
    driver: bridge
